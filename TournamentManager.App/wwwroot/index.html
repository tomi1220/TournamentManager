<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TournamentManager.App</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="TournamentManager.App.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
</body>

<script>
    // 💡 IndexedDBを開く（または自動作成）
    function getDb() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open("TournamentAuthDb", 1);
            request.onupgradeneeded = (e) => {
                e.target.result.createObjectStore("KvStore");
            };
            request.onsuccess = (e) => resolve(e.target.result);
            request.onerror = (e) => reject(e.target.error);
        });
    }

    // 💾 データを保存する関数
    async function saveToIndexedDb(key, jsonText) {
        const db = await getDb();
        const tx = db.transaction("KvStore", "readwrite");
        tx.objectStore("KvStore").put(jsonText, key);
    }

    // 📂 データを読み込む関数
    async function loadFromIndexedDb(key) {
        const db = await getDb();
        return new Promise((resolve) => {
            const tx = db.transaction("KvStore", "readonly");
            const req = tx.objectStore("KvStore").get(key);
            req.onsuccess = () => resolve(req.result || "");
        });
    }

    // C#のストリームを受け取り、ブラウザの「ファイルダウンロード」を発火させる関数
    async function downloadFileFromStream(fileName, contentStreamReference) {
        const arrayBuffer = await contentStreamReference.arrayBuffer();
        const blob = new Blob([arrayBuffer]);
        const url = URL.createObjectURL(blob);
        const anchorElement = document.createElement('a');
        anchorElement.href = url;
        anchorElement.download = fileName ?? '';
        anchorElement.click();
        anchorElement.remove();
        URL.revokeObjectURL(url);
    }

</script>

</html>
